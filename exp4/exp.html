<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4 - Midnight Magic</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* Midnight Animated Gradient Background */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Midnight palette: Deep Blues, Purples, and Dark Magentas */
            background: linear-gradient(-45deg, #02010a, #0d001c, #12002f, #1a0033);
            background-size: 400% 400%;
            animation: midnightFlow 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        @keyframes midnightFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            text-align: center;
            color: #e0e0e0;
            width: 380px;
            transition: transform 0.3s ease;
        }

        h2 {
            margin-top: 0;
            font-size: 2.2rem;
            background: linear-gradient(to right, #fff, #b393d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #9d50bb;
            box-shadow: 0 0 15px rgba(157, 80, 187, 0.4);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Neon Button */
        #greetBtn {
            background: linear-gradient(45deg, #6e48aa, #9d50bb);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(110, 72, 170, 0.5);
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #greetBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(157, 80, 187, 0.7);
            filter: brightness(1.2);
        }

        #greetBtn:active {
            transform: scale(0.98);
        }

        #message {
            margin-top: 30px;
            font-size: 1.2rem;
            min-height: 40px;
            transition: all 0.5s ease;
            line-height: 1.5;
        }

        /* Error Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }

        .shake-it {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>✨ Midnight Oracle</h2>
        <p style="opacity: 0.7;">Enter your name to summon the light.</p>
        
        <input type="text" id="username" placeholder="Your name..." autocomplete="off">
        
        <button id="greetBtn">Reveal Magic</button>

        <p id="message"></p>
    </div>

    <script>
        const btn = document.getElementById('greetBtn');
        const input = document.getElementById('username');
        const message = document.getElementById('message');
        const card = document.getElementById('mainCard');

        btn.addEventListener('click', () => {
            const name = input.value.trim();

            if (name === "") {
                message.innerText = "✖ The shadows require a name.";
                message.style.color = "#ff4b2b";
                card.classList.add('shake-it');
                setTimeout(() => card.classList.remove('shake-it'), 400);
                return;
            }

            // --- THE MAGIC ---

            // Confetti with midnight colors (purple, gold, white)
            confetti({
                particleCount: 180,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#9d50bb', '#6e48aa', '#ffd700', '#ffffff']
            });

            // Extra side bursts
            setTimeout(() => {
                confetti({ particleCount: 40, angle: 60, spread: 50, origin: { x: 0 }, colors: ['#9d50bb', '#ffffff'] });
                confetti({ particleCount: 40, angle: 120, spread: 50, origin: { x: 1 }, colors: ['#9d50bb', '#ffffff'] });
            }, 150);

            // Update Message
            message.style.opacity = 0;
            setTimeout(() => {
                message.innerHTML = `Welcome, <span style="color: #ffd700;">${name}</span>!<br>The stars have aligned for you.`;
                message.style.color = "white";
                message.style.textShadow = "0 0 15px rgba(255,255,255,0.6), 0 0 30px #9d50bb";
                message.style.opacity = 1;
            }, 300);
        });

        // Enter key support
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btn.click();
        });
    </script>
</body>
</html>
